[package]
name = "redy"
version = "0.1.0"
edition = "2024"

[dependencies]
legible = "0.4.2"
readabilityrs = "0.1.2"
reqwest = "0.13.2"
tokio = { version = "1.50.0", features = ["full"] }
chromiumoxide = "0.6"
axum = { version = "0.7", features = ["json"] }
axum-oidc = "0.2"
tower-sessions = "0.12"
tower = "0.4"
serde = { version = "1.0", features = ["derive"] }
anyhow = "1.0.102"
lazy_static = "1.5.0"
thiserror = "2.0.18"
sea-orm = { version = "2.0.0-rc", features = [
    "sqlx-postgres",
    "runtime-tokio-native-tls",
    "macros",
    "with-uuid",
] }
futures = "0.3.32"
